<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Modal with Pagination</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

<!-- Button trigger modal -->
<button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#staticBackdrop">
    Launch static backdrop modal
</button>

<!-- Modal -->
<div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
     aria-labelledby="staticBackdropLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="staticBackdropLabel">Modal title</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <!-- Content sections -->
                <div class="content" id="content1">
                    <p>Content 1 goes here.</p>
                </div>
                <div class="content" id="content2">
                    <p>Content 2 goes here.</p>
                </div>
                <div class="content" id="content3">
                    <p>Content 3 goes here.</p>
                </div>
            </div>
            <nav aria-label="Page navigation example">
                <ul class="pagination justify-content-center">
                    <li class="page-item" id="prev">
                        <a class="page-link" href="#" tabindex="-1">Previous</a>
                    </li>
                    <li class="page-item active" id="page1">
                        <a class="page-link" href="#">1</a>
                    </li>
                    <li class="page-item" id="page2">
                        <a class="page-link" href="#">2</a>
                    </li>
                    <li class="page-item" id="page3">
                        <a class="page-link" href="#">3</a>
                    </li>
                    <li class="page-item" id="next">
                        <a class="page-link" href="#">Next</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        // Pagination logic
        var currentPage = 1;
        var previousPage = 0;
        var totalPages = 3;
        var modalContent = document.querySelectorAll('.modal-body .content');

        // Function to update modal content
        function updateModalContent(page) {
            // Hide all content sections
            modalContent.forEach(function (content) {
                content.style.display = "none";
            });
            // Show the content section corresponding to the current page
            document.getElementById('content' + page).style.display = "block";

            switch (previousPage) {
                case 0:
                    break
                default :
                    document.getElementById('page' + previousPage).classList.remove('active');
                    document.getElementById('page' + currentPage).classList.add('active');
            }


        }

        // Initial content update
        updateModalContent(currentPage);

        // Next button click event
        document.getElementById('next').addEventListener('click', function () {
            if (currentPage < totalPages) {
                previousPage = currentPage;
                currentPage++;

                updateModalContent(currentPage);
            }
        });

        // Previous button click event
        document.getElementById('prev').addEventListener('click', function () {
            if (currentPage > 1) {
                previousPage = currentPage;
                currentPage--;
                updateModalContent(currentPage);
            }
        });

        // Pagination button click events
        document.getElementById('page1').addEventListener('click', function () {
            previousPage = currentPage;
            currentPage = 1;
            updateModalContent(currentPage);

        });

        document.getElementById('page2').addEventListener('click', function () {
            previousPage = currentPage;
            currentPage = 2;
            updateModalContent(currentPage);
        });

        document.getElementById('page3').addEventListener('click', function () {
            previousPage = currentPage;
            currentPage = 3;
            updateModalContent(currentPage);
        });
    });
</script>

</body>
</html>
