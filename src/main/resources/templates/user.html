<!DOCTYPE html>
<html lang="en"
      layout:decorate="~{/layout/main-layout}"
      xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">

<title layout:fragment="title">User</title>
<div layout:fragment="content">

    <div class="container-fluid p-6">

        <!--Start User -->
        <div class="row mt-3">
            <div class="col-md-12 col-12">
                <!-- card  -->
                <div class="card">
                    <!-- card header  -->
                    <div class="card-header bg-white py-4">
                        <h4 class="mb-0 text-primary">User
                            <span data-bs-target="#model" data-bs-toggle="modal" onclick="changeAdd()" type="button">
                                <i class="bi bi-plus-square ml-5" style="font-size: 1.4rem"></i>
                            </span>
                        </h4>
                    </div>

                    <div class="p-5">
                        <table class="hover table table-striped" id="myTable" style="width: 100%">
                            <thead>
                            <tr>
                                <th>Name</th>
                                <th>Role</th>
                                <th>Action</th>

                            </tr>
                            </thead>
                            <tfoot>
                            <tr>
                                <th>Name</th>
                                <th>Role</th>
                                <th>Action</th>

                            </tr>
                            </tfoot>
                        </table>
                    </div>

                </div>
            </div>
        </div>
        <!--End User-->

        <!--Start User Add Modal -->
        <div aria-hidden="true" class="modal fade" data-bs-backdrop="static" id="model" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="modelTitle">Add User</h1>
                        <button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
                    </div>
                    <form id="myForm">
                        <div class="modal-body">
                            <div class="form-floating my-3">
                                <input class="form-control" id="user" name="user" placeholder="User" type="text">
                                <label for="user">User</label>
                            </div>
                            <hr>
                            <select aria-label="role select" class="form-select my-3" id="roleSelect">
                                <option disabled selected value="">Select Role</option>
                            </select>
                            <hr>

                            <div class="form-floating my-3 password-form">
                                <input class="form-control" id="password" max="12" min="8"
                                       name="password" placeholder="Password(Optional)" type="password">
                                <label for="password" id="passwordLabel">Password</label>
                            </div>
                            <div class="form-floating my-3 password-form">
                                <input class="form-control" id="confirmPassword" max="12"
                                       min="8" name="confirmPassword" placeholder="Confirm Password" type="password">
                                <label for="confirmPassword">Confirm Password</label>
                            </div>

                        </div>
                        <div class="modal-footer">
                            <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Close</button>

                            <button class="btn btn-primary" id="myButton" onclick="adding()" type="button">Save</button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
        <!--End User Add Modal -->

    </div>

</div>
<script layout:fragment="scripts2" th:src="@{/js/table.js}"></script>
<script layout:fragment="scripts" th:src="@{/js/user.js}"></script>


</html>
