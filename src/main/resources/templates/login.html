<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1, shrink-to-fit=no" name="viewport">
    <!-- Favicon icon-->
    <link rel="shortcut icon" th:href="@{/image/church-christian.svg}" type="image/x-icon">
    <!-- Libs CSS -->
    <link rel="stylesheet" th:href="@{/libs/bootstrap-icons/font/bootstrap-icons.css}">


    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <title>Sign In</title>
    <style>

        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 25px;
            display: none;
        }

    </style>
</head>

<body class="bg-light">
<!-- container -->
<div class="container d-flex flex-column">
    <div class="row align-items-center justify-content-center g-0
        min-vh-100">
        <div class="col-12 col-md-8 col-lg-6 col-xxl-4 py-8 py-xl-0">
            <!-- Card -->
            <div class="card smooth-shadow-md">
                <!-- Card body -->
                <div class="card-body p-6">
                    <div class="mb-4">

                        <h1 class="text-center pb-2">Log In</h1>
                    </div>
                    <div id="validated_alert" role="alert"></div>
                    <!-- Form -->
                    <form class="needs-validation" id="login-form" method="post" novalidate th:action="@{/login}">
                        <!-- Username -->
                        <div class="form-floating form-group position-relative has-icon-left mb-3">
                            <input class="form-control" id="username" name="username" placeholder="Username" required
                                   type="text">
                            <label for="username">
                                <i class="bi bi-person"></i>
                                Username
                            </label>
                        </div>

                        <div class="form-floating form-group position-relative has-icon-left mb-3">
                            <input autocapitalize="off" autocomplete="current-password" autocorrect="off" class="form-control"
                                   id="password" name="password" placeholder="password" required
                                   spellcheck="false" type="password">

                            <label for="password">
                                <i class="bi bi-shield-lock"></i>
                                Password
                            </label>

                            <i class="bi bi-eye-slash password-toggle" id="togglePassword"

                            ></i>
                        </div>
                        <!-- Checkbox -->
                        <div class="d-lg-flex justify-content-between align-items-center
                  mb-4">
                            <div class="form-check custom-checkbox">
                                <input class="form-check-input" id="remember-me" name="remember-me" type="checkbox">
                                <label class="form-check-label" for="remember-me">Remember
                                    me</label>
                            </div>

                        </div>
                        <div>
                            <!-- Button -->
                            <div class="d-grid">
                                <button class="btn btn-primary" type="submit">Sign
                                    in
                                </button>
                            </div>

                        </div>


                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- Scripts -->
<!-- Libs JS -->
<script th:src="@{/libs/jquery/jquery.min.js}"></script>
<script th:src="@{/libs/bootstrap/js/bootstrap.bundle.min.js}"></script>


<script>
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const alertDiv = document.getElementById('validated_alert');
    document.addEventListener('DOMContentLoaded', function () {


        const queryParams = new URLSearchParams(window.location.search);
        const isError = queryParams.get('error');
        const isSuccess = queryParams.get('logout_success');

        if (isError === "bad_credentials") {

            alertDiv.className = 'alert alert-danger position-relative mb-4';
            alertDiv.innerHTML = 'Username or Password is incorrect!';

        } else if (isError === "disabled") {

            alertDiv.className = 'alert alert-danger position-relative mb-4';
            alertDiv.innerHTML = 'Your account is disabled!';

        } else if (isSuccess) {

            alertDiv.className = 'alert alert-success position-relative mb-4';
            alertDiv.innerHTML = 'Logout Success.';
        }

// <-----------------------------------------------Password Toggle---------------------------------------------------->

        const toggleButton = document.getElementById('togglePassword');


        passwordInput.addEventListener('input', function () {
            // Show toggle button when there is input in the password field
            toggleButton.style.display = passwordInput.value.length > 0 ? 'block' : 'none';
        });

        toggleButton.addEventListener('click', function () {
            // Toggle password visibility
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
            } else {
                passwordInput.type = 'password';
            }
        });
    });

    (() => {
        'use strict';
        const forms = document.querySelectorAll('.needs-validation');

        Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                }

                if (usernameInput.value === undefined || usernameInput.value === null || usernameInput.value.trim() === '' || passwordInput.value === undefined || passwordInput.value === null || passwordInput.value.trim() === '') {
                    alertDiv.className = 'alert alert-danger position-relative mb-4';
                    alertDiv.innerHTML = 'Please Fill Username and Password to Sign In!';
                }
            }, false);
        });
    })();


</script>
</body>

</html>
