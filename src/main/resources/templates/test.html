<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Modal with Pagination</title>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

</head>
<body>


<button type="button" onclick="api()">
    Test
</button>
<button type="button" onclick="get()">
    Test2
</button>


<script>
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute("content");
    const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute("content");

    function api() {
        fetch('/spcu-dims/api/v1/annual-return/create', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                [csrfHeader]: csrfToken
            },
            body: JSON.stringify({
                year : 'AKZ'
            })

        })
            .then(async response => {
                console.log(await response.text())
            })

            .catch(error => {
                console.error(error); // Optionally log the error to the console for debugging
            });
    }

    function get() {
        fetch('/spcu-dims/api/v1/activity/show/1')
            .then(async response => {
                console.log(await response.text())
            })

            .catch(error => {
                console.error(error); // Optionally log the error to the console for debugging
            });
    }
</script>

</body>
</html>
