<div class="header" th:fragment="navbar" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <nav class="navbar-classic navbar navbar-expand-lg">
        <a href="#" id="nav-toggle"><i class="nav-icon me-2 icon-xs" data-feather="menu"></i></a>

        <!--Navbar nav -->
        <ul class="navbar-nav navbar-right-wrap ms-auto d-flex nav-top-wrap">

            <li class="dropdown ms-2">
                <a aria-expanded="false" aria-haspopup="true" class="rounded-circle" data-bs-toggle="dropdown" href="#"
                   id="dropdownUser" role="button">
                    <div class="avatar avatar-md avatar-indicators avatar-online">
                        <img alt="avatar" class="rounded-circle" th:src="@{/assets/images/profile.jpeg}"/>
                    </div>
                </a>
                <div aria-labelledby="dropdownUser" class="dropdown-menu dropdown-menu-end">
                    <div class="px-4 pb-0 pt-2">

                            <h5 class="mb-1" hidden id="login-role" sec:authentication="principal.role"></h5>
                            <h5 class="mb-1" hidden id="login-id" sec:authentication="principal.userId"></h5>
                            <h5 class="mb-1" sec:authentication="principal.username"></h5>
                        </div>
                        <div class=" dropdown-divider mt-3 mb-2"></div>
                    </div>
                    <ul class="list-unstyled">
                        <li>
                            <a class="dropdown-item" href="/password-change">
                                <i class="me-2 icon-xxs dropdown-item-icon" data-feather="settings"></i>Password Change
                            </a>
                        </li>
                        <li>
                            <form method="post" th:action="@{/logout}">
                                <button class="dropdown-item" type="submit">
                                    <i class="me-2 icon-xxs dropdown-item-icon" data-feather="power"></i>Sign Out
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </li>
        </ul>
    </nav>


</div>
