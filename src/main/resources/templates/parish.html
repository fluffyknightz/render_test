<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout"
      layout:decorate="~{/layout/main-layout}">


<div layout:fragment="content">

    <div class="container-fluid p-6">

        <!--Start Parish -->
        <div class="row mt-3">
            <div class="col-md-12 col-12">
                <!-- card  -->
                <div class="card">
                    <!-- card header  -->
                    <div class="card-header bg-white py-4">
                        <div class="row">
                            <div class="d-flex justify-content-between align-items-center">
                                <div class="col-8">
                                    <h4 class="mb-0 text-primary">Township
                                        <span type="button" data-bs-toggle="modal" data-bs-target="#model"
                                              onclick="changeAdd()">
                                    <i class="bi bi-plus-square ml-5" style="font-size: 1.4rem"></i>
                                </span>
                                    </h4>
                                </div>
                                <div class="col-2">
                                    <select class="form-select my-3 col-auto" aria-label="district select"
                                            id="filterDistrict">
                                        <option selected disabled>Filter District</option>
                                        <option value="">None</option>
                                    </select>
                                </div>
                                <div class="col-2">
                                    <select class="form-select my-3 col-auto" aria-label="district select"
                                            id="filterRegion">
                                        <option selected disabled>Filter Region</option>
                                        <option value="">None</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>


                    <div class="p-5">
                        <table id="myTable" class="hover table table-striped" style="width: 100%">
                            <thead>
                            <tr>
                                <th>No</th>
                                <th>Name</th>
                                <th>Diocese</th>
                                <th>Archdiocese</th>
                                <th>Zone</th>
                                <th>Region</th>
                                <th>District</th>
                                <th>Township</th>
                                <th>Action</th>
                            </tr>
                            </thead>
                        </table>
                    </div>

                </div>
            </div>
        </div>
        <!--End Parish-->

        <!--Start Parish Add Modal -->
        <div class="modal fade" id="model" data-bs-backdrop="static" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 id="modelTitle" class="modal-title fs-5">Add Parish</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <form id="myForm">
                        <div class="modal-body">
                            <div class="form-floating my-3">
                                <input type="text" class="form-control" name="parish" id="parish"
                                       placeholder="Parish">
                                <label for="parish">Parish</label>
                            </div>
                            <select class="form-select my-3" aria-label="region select" id="regionSelect">
                                <option selected disabled>Select Related Region</option>
                                <option value="">None</option>
                            </select>
                            <select class="form-select my-3" aria-label="district select" id="districtSelect">
                                <option selected disabled>Select Related District</option>
                                <option value="">None</option>
                            </select>

                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>

                            <button type="button" class="btn btn-primary" id="myButton" onclick="adding()">Save</button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
        <!--End Parish Add Modal -->

    </div>

</div>

<script layout:fragment="scripts" th:src="@{/js/parish.js}"></script>

</html>
