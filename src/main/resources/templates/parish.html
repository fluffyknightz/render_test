<!DOCTYPE html>
<html lang="en"
      layout:decorate="~{/layout/main-layout}"
      xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">

<title layout:fragment="title">Parish</title>
<div layout:fragment="content">

    <div class="container-fluid p-6">

        <!--Start Zone -->
        <div class="row mt-3">
            <div class="col-md-12 col-12">
                <!-- card  -->
                <div class="card">
                    <!-- card header  -->
                    <div class="card-header bg-white py-4">
                        <div class="row">
                            <div class="d-flex justify-content-between align-items-center">
                                <div class="col-8">
                                    <h4 class="mb-0 text-primary">Parish
                                        <span data-bs-target="#model" data-bs-toggle="modal" onclick="changeAdd()"
                                              type="button">
                                            <i class="bi bi-plus-square ml-5" style="font-size: 1.4rem"></i>
                                        </span>
                                    </h4>
                                </div>
                                <div class="col-2">
                                    <select aria-label="zone select" class="form-select my-3 col-auto" id="filterZone">
                                        <option disabled selected>Filter Zone</option>
                                        <option value="">None</option>
                                    </select>
                                </div>
                                <div class="col-2">
                                    <select aria-label="township select" class="form-select my-3 col-auto"
                                            id="filterTownship">
                                        <option disabled selected>Filter Township</option>
                                        <option value="">None</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="p-5">
                        <table class="hover table table-striped" id="myTable" style="width: 100%">
                            <thead>
                            <tr>
                                <th></th>
                                <th>Name</th>
                                <th>Archdiocese</th>
                                <th>Diocese</th>
                                <th>Zone</th>
                                <th>Region</th>
                                <th>District</th>
                                <th>Township</th>
                                <th>Action</th>
                            </tr>
                            </thead>
                            <tfoot>
                            <tr>
                                <th></th>
                                <th>Name</th>
                                <th>Archdiocese</th>
                                <th>Diocese</th>
                                <th>Zone</th>
                                <th>Region</th>
                                <th>District</th>
                                <th>Township</th>
                                <th>Action</th>
                            </tr>
                            </tfoot>
                        </table>
                    </div>

                </div>
            </div>
        </div>
        <!--End Zone-->

        <!--Start Zone Add Modal -->
        <div aria-hidden="true" class="modal fade" data-bs-backdrop="static" id="model" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="modelTitle">Add Parish</h1>
                        <button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
                    </div>
                    <form id="myForm">
                        <div class="modal-body">
                            <div class="form-floating my-3">
                                <input class="form-control" id="parish" name="parish" placeholder="Parish"
                                       type="text">
                                <label for="parish">Parish</label>
                            </div>
                            <hr>
                            <select aria-label="township select" class="form-select my-3" id="townshipSelect">
                                <option disabled selected value="">Select Related Township</option>

                            </select>
                            <hr>
                            <div class="my-3">
                                <textarea class="form-control" id="note" name="note" placeholder="Note(Optional)" rows="5"
                                          type="text"></textarea>

                            </div>
                        </div>
                        <div class="modal-footer">
                            <button class="btn btn-secondary" data-bs-dismiss="modal" type="button">Close</button>

                            <button class="btn btn-primary" id="myButton" onclick="adding()" type="button">Save</button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
        <!--End Zone Add Modal -->

    </div>

</div>
<script layout:fragment="scripts2" th:src="@{/js/table.js}"></script>
<script layout:fragment="scripts" th:src="@{/js/parish.js}"></script>

</html>
