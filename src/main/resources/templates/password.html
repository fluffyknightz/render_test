<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <!-- Favicon icon-->
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/theme/assets/images/favicon/favicon.ico}">
    <!-- Libs CSS -->
    <link th:href="@{/libs/bootstrap-icons/font/bootstrap-icons.css}" rel="stylesheet">


    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <title>Sign In | Dash Ui - Bootstrap 5 Admin Dashboard Template</title>
    <style>

        .form-control.is-invalid,
        .was-validated .form-control:invalid {
            background-image: none !important;
        }

        .form-control.is-valid,
        .was-validated .form-control:valid {
            background-image: none !important;
        }

        .form-check-input.is-valid,
        .was-validated .form-check-input:valid {
            border-color: #ccc !important;
        }

        .form-check-input.is-valid:checked,
        .was-validated .form-check-input:valid:checked {
            background-color: #1e497b !important;
            border-color: #1e497b !important;
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 25px;
            display: none;
        }

    </style>
</head>

<body class="bg-light">
<!-- container -->
<div class="container d-flex flex-column">
    <div class="row align-items-center justify-content-center g-0
        min-vh-100">
        <div class="col-12 col-md-8 col-lg-6 col-xxl-4 py-8 py-xl-0">
            <!-- Card -->
            <div class="card smooth-shadow-md">
                <!-- Card body -->
                <div class="card-body p-6">
                    <div class="mb-4">

                        <h1 class="text-center pb-2">Log In</h1>
                    </div>
                    <div id="validated_alert" role="alert"></div>
                    <!-- Form -->
                    <form id="myForm">
                        <!-- Username -->
                        <div class="form-floating form-group position-relative has-icon-left mb-3">
                            <input type="password" id="oldPassword" name="oldPassword" autocomplete="current-password"
                                   class="form-control" spellcheck="false" autocorrect="off" autocapitalize="off"
                                   placeholder="Old Password">

                            <label for="oldPassword">
                                <i class="bi bi-shield-lock"></i>
                                Old Password
                            </label>

                            <i class="bi bi-eye-slash password-toggle" id="togglePassword1"

                            ></i>
                        </div>
                        <div class="form-floating form-group position-relative has-icon-left mb-3">
                            <input type="password" id="newPassword" name="newPassword" autocomplete="current-password"
                                   class="form-control" spellcheck="false" autocorrect="off" autocapitalize="off"
                                   placeholder="New Password" min="7" max="12">

                            <label for="newPassword">
                                <i class="bi bi-shield-lock"></i>
                                New Password
                            </label>

                            <i class="bi bi-eye-slash password-toggle" id="togglePassword2"

                            ></i>
                        </div>

                        <div class="form-floating form-group position-relative has-icon-left mb-3">
                            <input type="password" id="confirmPassword" name="confirmPassword"
                                   autocomplete="current-password"
                                   class="form-control" spellcheck="false" autocorrect="off" autocapitalize="off"
                                   placeholder="Confirm Password" min="7" max="12">

                            <label for="confirmPassword">
                                <i class="bi bi-shield-lock"></i>
                                Confirm Password
                            </label>

                            <i class="bi bi-eye-slash password-toggle" id="togglePassword3"

                            ></i>
                        </div>

                        <div class="mt-4">
                            <!-- Button -->
                            <div class="d-grid">
                                <button type="button" id="myButton" class="btn btn-primary" onclick="change()">Change
                                </button>
                            </div>

                        </div>


                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- Scripts -->
<!-- Libs JS -->
<script th:src="@{/libs/jquery/dist/jquery.min.js}"></script>
<script th:src="@{/libs/bootstrap/dist/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/token.js}"></script>


<script>


    document.getElementById('myForm').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
            e.preventDefault(); // Prevent default form submission
            document.getElementById('myButton').click(); // Trigger the 'Save' button click event
        }
    });

    const oldPassword = document.getElementById('oldPassword');
    const newPassword = document.getElementById('newPassword');
    const confirmPassword = document.getElementById('confirmPassword');
    const alertDiv = document.getElementById('validated_alert');

    document.addEventListener('DOMContentLoaded', function () {


// <-----------------------------------------------Password Toggle---------------------------------------------------->

        const toggleButton1 = document.getElementById('togglePassword1');
        const toggleButton2 = document.getElementById('togglePassword2');
        const toggleButton3 = document.getElementById('togglePassword3');


        function setupPasswordToggle(inputField, toggleButton) {
            inputField.addEventListener('input', function () {
                // Show toggle button when there is input in the password field
                toggleButton.style.display = inputField.value.length > 0 ? 'block' : 'none';
                if (inputField === confirmPassword) {
                    setTimeout(() => {
                        if (newPassword.value !== confirmPassword.value) {
                            alertDiv.className = 'alert alert-danger position-relative mb-4';
                            alertDiv.innerHTML = 'New Password and Confirm Password do not match!';
                        } else {
                            alertDiv.removeAttribute('class');
                            alertDiv.innerHTML = '';
                        }
                    }, 1500)
                }
            });

            toggleButton.addEventListener('click', function () {
                // Toggle password visibility
                if (inputField.type === 'password') {
                    inputField.type = 'text';
                } else {
                    inputField.type = 'password';
                }
            });
        }

        setupPasswordToggle(oldPassword, toggleButton1);
        setupPasswordToggle(newPassword, toggleButton2);
        setupPasswordToggle(confirmPassword, toggleButton3);

    });

    function change() {


        if (oldPassword === undefined || oldPassword.value.trim() === null || oldPassword.value === '' ||
            newPassword === undefined || newPassword.value.trim() === '' || newPassword.value === '' ||
            confirmPassword === undefined || confirmPassword.value.trim() === '' || confirmPassword.value === '') {

            alertDiv.className = 'alert alert-danger position-relative mb-4';
            alertDiv.innerHTML = 'Please Fill All Data to change Password!';
        } else
            fetch('/spcu-dims/api/v1/user/password?oldPassword=' + oldPassword.value + '&&newPassword=' + newPassword.value, {
                method: 'PATCH',
                headers: {
                    [csrfHeader]: csrfToken,
                    'Content-Type': 'application/json'
                },
                body: null,
            })
                .then(r => {
                    if (r.status === 200 || r.status === 201) {
                        window.history.back();
                    } else {
                        alertDiv.className = 'alert alert-danger position-relative mb-4';
                        alertDiv.innerHTML = 'Old Password is wrong!';
                    }
                })


    }


</script>
</body>

</html>
