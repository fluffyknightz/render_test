<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <!-- Favicon icon-->
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/theme/assets/images/favicon/favicon.ico}">
    <!-- Libs CSS -->
    <link th:href="@{/libs/bootstrap-icons/font/bootstrap-icons.css}" rel="stylesheet">


    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <title>Password Change</title>
    <style>


        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 25px;
            display: none;
        }

    </style>
</head>

<body class="bg-light">
<!-- container -->
<div class="container d-flex flex-column">
    <div class="row align-items-center justify-content-center g-0
        min-vh-100">
        <div class="col-12 col-md-8 col-lg-6 col-xxl-4 py-8 py-xl-0">
            <!-- Card -->
            <div class="card smooth-shadow-md">
                <!-- Card body -->
                <div class="card-body p-6">
                    <div class="mb-4">

                        <h1 class="text-center pb-2">Log In</h1>
                    </div>
                    <div id="validated_alert" role="alert"></div>
                    <!-- Form -->
                    <form id="myForm">
                        <!-- Username -->
                        <div class="form-floating form-group position-relative has-icon-left mb-3">
                            <input type="password" id="oldPassword" name="oldPassword" autocomplete="current-password"
                                   class="form-control" spellcheck="false" autocorrect="off" autocapitalize="off"
                                   placeholder="Old Password">

                            <label for="oldPassword">
                                <i class="bi bi-shield-lock"></i>
                                Old Password
                            </label>

                            <i class="bi bi-eye-slash password-toggle" id="togglePassword1"

                            ></i>
                        </div>
                        <div class="form-floating form-group position-relative has-icon-left mb-3">
                            <input type="password" id="newPassword" name="newPassword" autocomplete="current-password"
                                   class="form-control" spellcheck="false" autocorrect="off" autocapitalize="off"
                                   placeholder="New Password" min="7" max="12">

                            <label for="newPassword">
                                <i class="bi bi-shield-lock"></i>
                                New Password
                            </label>

                            <i class="bi bi-eye-slash password-toggle" id="togglePassword2"

                            ></i>
                        </div>

                        <div class="form-floating form-group position-relative has-icon-left mb-3">
                            <input type="password" id="confirmPassword" name="confirmPassword"
                                   autocomplete="current-password"
                                   class="form-control" spellcheck="false" autocorrect="off" autocapitalize="off"
                                   placeholder="Confirm Password" min="7" max="12">

                            <label for="confirmPassword">
                                <i class="bi bi-shield-lock"></i>
                                Confirm Password
                            </label>

                            <i class="bi bi-eye-slash password-toggle" id="togglePassword3"

                            ></i>
                        </div>

                        <div class="mt-4">
                            <!-- Button -->
                            <div class="d-grid">
                                <button type="button" id="myButton" class="btn btn-primary" onclick="change()">Change
                                </button>
                            </div>
                        </div>
                        <div class="mt-4 d-flex justify-content-center">
                            <a href="javascript:history.back()">
                                Go Back
                            </a>
                        </div>


                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/libs/jquery/jquery.min.js}"></script>
<script th:src="@{/libs/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/token.js}"></script>
<script th:src="@{/js/password.js}></script>
</body>

</html>
