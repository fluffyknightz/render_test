<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout"
      layout:decorate="~{/layout/main-layout}">


<div layout:fragment="content">
    <div class="container d-flex flex-column">
        <div class="row align-items-center justify-content-center g-0
        min-vh-100">
            <div class="col-12 col-md-8 col-lg-6 col-xxl-4 py-8 py-xl-0">
                <!-- Card -->
                <div class="card smooth-shadow-md">
                    <!-- Card body -->
                    <div class="card-body p-6">
                        <div class="mb-4">

                            <h1 class="text-center pb-2">Profile</h1>
                        </div>
                        <div id="validated_alert" role="alert"></div>
                        <!-- Form -->
                        <form id="login-form" th:action="@{/login}" method="post" class="needs-validation" novalidate>
                            <!-- Username -->
                            <div class="form-floating form-group position-relative has-icon-left mb-3">
                                <input type="text" class="form-control" placeholder="Username" id="username" name="username"
                                       required>
                                <label for="username">
                                    <i class="bi bi-person"></i>
                                    Username
                                </label>
                            </div>

                            <div class="form-floating form-group position-relative has-icon-left mb-3">


                                <!-- Button -->
                                <div class="d-grid">
                                    <button type="submit" class="btn btn-primary">Sign
                                        in
                                    </button>
                                </div>


                            </div>


                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</html>
