<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout">

<head>

    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <!-- Favicon icon-->
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/theme/assets/images/favicon/favicon.ico}">

    <!-- Libs CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/libs/bootstrap-icons/font/bootstrap-icons.css}" rel="stylesheet">
    <link th:href="@{/libs/dropzone/dist/dropzone.css}" rel="stylesheet">
    <link th:href="@{/libs/mdi/font/css/materialdesignicons.min.css}" rel="stylesheet" />
    <link th:href="@{/libs/prismjs/themes/prism-okaidia.css}" rel="stylesheet">
    <link href="https://cdn.datatables.net/2.0.2/css/dataTables.bootstrap5.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/buttons/3.0.1/css/buttons.dataTables.css" rel="stylesheet">
    <link th:href="@{/libs/notiflix/dist/notiflix-3.2.7.min.css}" rel="stylesheet">

    <!-- Theme CSS -->
    <link rel="stylesheet" th:href="@{/css/theme.css}">

    <title>Homepage | Dash Ui - Bootstrap 5 Admin Dashboard Template</title>

</head>

<body class="bg-light">
<div id="db-wrapper">

    <!-- Side Bar -->
    <div th:replace="~{/fragments/sidebar :: sidebar}">...</div>

    <!-- Page content -->
    <div id="page-content">

        <!-- Navbar -->
        <div th:replace="~{/fragments/navbar :: navbar}">...</div>

        <!--Main Content-->
        <div layout:fragment="content"></div>

    </div>
</div>

<!-- Scripts -->
<!-- Libs JS -->



<script th:src="@{/js/token.js}"></script>
<script src="https://code.jquery.com/jquery-3.7.1.js"></script>

<script th:src="@{/libs/jquery-slimscroll/jquery.slimscroll.min.js}"></script>

<script th:src="@{/libs/feather-icons/dist/feather.min.js}"></script>
