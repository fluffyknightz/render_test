<!DOCTYPE html>
<html lang="en" xmlns:layout="http://www.ultraq.net.nz/web/thymeleaf/layout" xmlns:th="http://www.thymeleaf.org">

<head>

    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1, shrink-to-fit=no" name="viewport">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <!-- Favicon icon-->
    <link rel="shortcut icon" th:href="@{/image/church-christian.svg}" type="image/x-icon">

    <!-- CSS Bootstrap -->
    <link rel="stylesheet" th:href="@{/libs/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/libs/bootstrap-icons/font/bootstrap-icons.css}">

    <!-- CSS Datatables -->
    <link rel="stylesheet" th:href="@{/libs/datatables/css/datatables.bootstrap5.css}">
    <link rel="stylesheet" th:href="@{/libs/datatables/css/buttons.bootstrap5.css}"/>
    <link rel="stylesheet" th:href="@{/libs/datatables/css/searchPanes.bootstrap5.css}"/>
    <link rel="stylesheet" th:href="@{/libs/datatables/css/select.bootstrap5.css}"/>

    <!-- CSS Other -->
    <link rel="stylesheet" th:href="@{/libs/notiflix/dist/notiflix-3.2.7.min.css}">
    <link rel="stylesheet" th:href="@{/libs/date-range-picker/daterangepicker.css}"/>
    <link rel="stylesheet" th:href="@{/libs/jquery-year-picker/css/style.css}"/>
    <link rel="stylesheet" th:href="@{/libs/jquery-year-picker/css/yearpicker.css}"/>
    <link rel="stylesheet" th:href="@{/landing-page/assets/vendor/boxicons/css/boxicons.min.css}">

    <!-- Theme CSS -->
    <link rel="stylesheet" th:href="@{/css/theme.css}">

    <title layout:fragment="title"></title>


</head>

<body class="bg-light">
<div class="toggled" id="db-wrapper">

    <!-- Side Bar -->
    <div th:replace="~{/fragments/sidebar :: sidebar}">...</div>

    <!-- Page content -->
    <div id="page-content">

        <!-- Navbar -->
        <div th:replace="~{/fragments/navbar :: navbar}">...</div>

        <!--Main Content-->
        <div layout:fragment="content"></div>

    </div>
</div>

<!-- CSRF Token -->
<script th:src="@{/js/token.js}"></script>

<script th:src="@{/libs/jquery/jquery.min.js}"></script>
<script th:src="@{/libs/bootstrap/js/bootstrap.bundle.min.js}"></script>

<!-- Datatables JS -->
<script th:src="@{/libs/datatables/js/datatables.js}"></script>
<script th:src="@{/libs/datatables/js/datatables.bootstrap5.js}"></script>
<script th:src="@{/libs/datatables/js/datatables.buttons.js}"></script>
<script th:src="@{/libs/datatables/js/buttons.bootstrap5.js}"></script>
<script th:src="@{/libs/datatables/js/datatables.searchPanes.js}"></script>
<script th:src="@{/libs/datatables/js/searchPanes.bootstrap5.js}"></script>
<script th:src="@{/libs/datatables/js/datatables.select.js}"></script>
<script th:src="@{/libs/datatables/js/select.bootstrap5.js}"></script>
<script th:src="@{/libs/datatables/js/jszip.min.js}"></script>
<script th:src="@{/libs/datatables/js/pdfmaker.min.js}"></script>
<script th:src="@{/libs/datatables/js/vfs_font.js}"></script>
<script th:src="@{/libs/datatables/js/buttons.html5.min.js}"></script>
<script th:src="@{/libs/datatables/js/buttons.print.min.js}"></script>
<script th:src="@{/libs/datatables/js/buttons.colvis.min.js}"></script>
<script th:src="@{/libs/datatables/js/jquery.spring-friendly.js}"></script>

<script th:src="@{/libs/jquery-slimscroll/jquery.slimscroll.min.js}"></script>
<script th:src="@{/libs/feather-icons/dist/feather.min.js}"></script>


<script th:src="@{/js/feather.js}"></script>

<script th:src="@{/libs/notiflix/dist/notiflix-3.2.7.min.js}"></script>


<script th:src="@{/libs/moment/moment.min.js}"></script>
<script th:src="@{/libs/date-range-picker/daterangepicker.min.js}"></script>
<script th:src="@{/libs/jquery-year-picker/js/yearpicker.js}"></script>


<!-- Theme JS -->
<script th:src="@{/js/main.js}"></script>
<script th:src="@{/js/navBar.js}"></script>
<script th:src="@{/js/sidebarMenu.js}"></script>
<script layout:fragment="scripts2"></script>
<script layout:fragment="scripts"></script>


</body>

</html>
