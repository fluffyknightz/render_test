    <!-- Libs CSS -->

    <link rel="stylesheet" th:href="@{/theme/assets/css/theme.css}">

    <title>Homepage | Dash Ui - Bootstrap 5 Admin Dashboard Template</title>

<body class="bg-light">
<div id="db-wrapper">
